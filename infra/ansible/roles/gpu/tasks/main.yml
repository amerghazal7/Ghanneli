---
# GPU + container runtime stack for the L40S box (Ubuntu 22.04).
# Idempotent: re-running converges without re-installing.

- name: Install base build/util packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - build-essential
    state: present
    update_cache: true

- name: Install NVIDIA driver + CUDA toolkit
  ansible.builtin.apt:
    name:
      - nvidia-driver-550
      - nvidia-cuda-toolkit
    state: present
  notify: reboot if driver changed

- name: Add Docker apt key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true

- name: Add NVIDIA Container Toolkit apt key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /usr/share/keyrings/nvidia-container-toolkit-keyring.asc
    mode: "0644"

- name: Add NVIDIA Container Toolkit repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.asc] https://nvidia.github.io/libnvidia-container/stable/deb/amd64 /"
    state: present
    filename: nvidia-container-toolkit

- name: Install NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Configure Docker to use the NVIDIA runtime
  ansible.builtin.command:
    cmd: nvidia-ctk runtime configure --runtime=docker
  register: nvidia_ctk
  changed_when: "'already' not in (nvidia_ctk.stdout | default(''))"
  notify: restart docker

- name: Ensure Docker is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
